<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breakout Master v0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#20375b,#060a15 78%);color:#eaf6ff;font-family:system-ui,"Microsoft JhengHei",sans-serif;display:grid;place-items:center}.wrap{width:min(96vw,850px);padding:18px}h1{text-align:center;letter-spacing:2px;color:#67e8f9;margin:4px 0}.sub{text-align:center;color:#9ab1cc;margin:4px 0 16px}.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:700;margin:0 0 12px}canvas{display:block;width:100%;height:auto;border:2px solid #315577;border-radius:12px;background:#0a1428;box-shadow:0 0 34px #0b8aca33;cursor:none;touch-action:none}.help{text-align:center;color:#aec2dc;font-size:14px;line-height:1.8;margin:12px 0}.actions{text-align:center}button{border:0;border-radius:10px;background:#1677cf;color:white;padding:12px 22px;font-weight:700;cursor:pointer}button:hover{background:#2598ed}.tag{color:#facc15}
</style>
</head><body><main class="wrap"><h1>🧱 BREAKOUT MASTER</h1><p class="sub">v0.2 · 道具風暴</p><div class="hud"><span id="score">分數：0</span><span id="level">關卡：1 / 5</span><span id="lives">生命：♥♥♥</span><span id="best">最高分：0</span></div><canvas id="game" width="800" height="520" aria-label="打磚塊遊戲"></canvas><div class="help">滑鼠／← →：移動　空白鍵：發球／暫停　<span class="tag">Z：雷射</span>　R：重新開始<br>🎁 藍色：加長　紫色：多球　紅色：雷射　綠色：慢速</div><div class="actions"><button id="start">開始遊戲／繼續</button></div></main>
<script>
(()=>{'use strict';
const cv=document.querySelector('#game'),c=cv.getContext('2d'),W=cv.width,H=cv.height;
const els={score:document.querySelector('#score'),level:document.querySelector('#level'),lives:document.querySelector('#lives'),best:document.querySelector('#best')};
let best=0;try{best=Number(localStorage.getItem('breakoutBest')||0)}catch{}
let score=0,level=1,lives=3,mode='ready',bricks=[],balls=[],drops=[],particles=[],shots=[],effects={wide:0,laser:0},keys={left:false,right:false},paddle={x:350,y:479,w:100,h:13,speed:9},lastShot=0,audio=null;
const palette=['#fb7185','#fb923c','#facc15','#4ade80','#38bdf8','#a78bfa'];
function beep(freq=440,duration=.055,type='sine') {try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function hud(){els.score.textContent='分數：'+score;els.level.textContent=`關卡：${level} / 5`;els.lives.textContent='生命：'+'♥'.repeat(Math.max(0,lives));els.best.textContent='最高分：'+best}
function brickSet(){bricks=[];let rows=3+level,cols=10,w=65,h=20,gap=7,x0=(W-(cols*w+(cols-1)*gap))/2;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)bricks.push({x:x0+col*(w+gap),y:65+r*29,w,h,alive:true,color:palette[r%palette.length]})}
function serve(){paddle.x=(W-paddle.w)/2;const speed=5+(level-1)*.55;balls=[{x:paddle.x+paddle.w/2,y:paddle.y-9,vx:speed*.65,vy:-speed,r:7}];mode='ready'}
function restart(){score=0;level=1;lives=3;paddle.w=100;drops=[];particles=[];shots=[];effects={wide:0,laser:0};brickSet();serve();hud()}
function launch(){if(mode==='ready'||mode==='paused')mode='playing'}
function start(){if(mode==='over'||mode==='won')restart();launch();beep(620)}
function fire(){if(mode!=='playing'||effects.laser<=0||lastShot>0)return;shots.push({x:paddle.x+12,y:paddle.y-3},{x:paddle.x+paddle.w-12,y:paddle.y-3});lastShot=13;beep(880,.04,'square')}
document.querySelector('#start').onclick=start;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.code==='KeyZ')fire();if(e.code==='KeyR')restart();if(e.code==='Space'){if(mode==='playing')mode='paused';else if(mode==='over'||mode==='won')start();else launch()}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false});
function pointer(e){const rect=cv.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2))}cv.addEventListener('pointermove',pointer);cv.addEventListener('click',()=>{if(mode==='ready'||mode==='paused')start()});
function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*18,color})}}
function award(x,y){if(Math.random()>.19)return;const types=['wide','multi','laser','slow'];drops.push({x,y,vy:2.1,type:types[Math.floor(Math.random()*types.length)]})}
function hitBrick(b){if(!b.alive)return;b.alive=false;score+=10;burst(b.x+b.w/2,b.y+b.h/2,b.color);award(b.x+b.w/2,b.y+b.h/2);beep(430+Math.random()*230,.035);if(score>best){best=score;try{localStorage.setItem('breakoutBest',best)}catch{}}hud()}
function power(type){beep(980,.14);if(type==='wide'){paddle.w=155;effects.wide=900}else if(type==='laser')effects.laser=900;else if(type==='slow'){for(const b of balls){b.vx*=.76;b.vy*=.76}}else if(type==='multi'&&balls.length<8){const extra=[];for(const b of balls.slice(0,3)){const s=Math.hypot(b.vx,b.vy);extra.push({...b,vx:-s*.72,vy:-Math.abs(s*.7)},{...b,vx:s*.72,vy:-Math.abs(s*.7)})}balls.push(...extra.slice(0,8-balls.length))}}
function tick(){if(keys.left)paddle.x-=paddle.speed;if(keys.right)paddle.x+=paddle.speed;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(mode==='ready'){balls[0].x=paddle.x+paddle.w/2;balls[0].y=paddle.y-9;return}if(mode!=='playing')return;
if(lastShot>0)lastShot--;for(const k of ['wide','laser'])if(effects[k]>0)effects[k]--;if(effects.wide===0&&paddle.w!==100){const center=paddle.x+paddle.w/2;paddle.w=100;paddle.x=Math.max(0,Math.min(W-paddle.w,center-paddle.w/2))}
for(const b of balls){const ox=b.x,oy=b.y;b.x+=b.vx;b.y+=b.vy;if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx);beep(270,.025)}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx);beep(270,.025)}if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.vy>0&&b.y+b.r>=paddle.y&&oy+b.r<=paddle.y+8&&b.x>=paddle.x-b.r&&b.x<=paddle.x+paddle.w+b.r){b.y=paddle.y-b.r;const s=Math.hypot(b.vx,b.vy),offset=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);b.vx=offset*s*.85;b.vy=-Math.sqrt(Math.max(4,s*s-b.vx*b.vx));beep(350,.04)}for(const brick of bricks){if(!brick.alive)continue;if(b.x+b.r>brick.x&&b.x-b.r<brick.x+brick.w&&b.y+b.r>brick.y&&b.y-b.r<brick.y+brick.h){const overlapX=Math.min(b.x+b.r-brick.x,brick.x+brick.w-(b.x-b.r)),overlapY=Math.min(b.y+b.r-brick.y,brick.y+brick.h-(b.y-b.r));hitBrick(brick);if(overlapX<overlapY){b.vx*=-1;b.x=ox}else{b.vy*=-1;b.y=oy}break}}}
balls=balls.filter(b=>b.y-b.r<=H);
for(const d of drops){d.y+=d.vy;if(d.y+12>=paddle.y&&d.y-12<=paddle.y+paddle.h&&d.x>=paddle.x&&d.x<=paddle.x+paddle.w){d.taken=true;power(d.type)}}drops=drops.filter(d=>!d.taken&&d.y<H+20);
for(const s of shots){s.y-=12;for(const b of bricks){if(b.alive&&s.x>=b.x&&s.x<=b.x+b.w&&s.y>=b.y&&s.y<=b.y+b.h){hitBrick(b);s.dead=true;break}}}shots=shots.filter(s=>!s.dead&&s.y>-10);
for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--}particles=particles.filter(p=>p.life>0);
if(bricks.every(b=>!b.alive)){if(level>=5){mode='won';beep(1100,.3)}else{level++;drops=[];shots=[];brickSet();serve()}hud();return}
if(!balls.length){lives--;drops=[];shots=[];effects={wide:0,laser:0};paddle.w=100;beep(170,.23,'sawtooth');if(lives<=0)mode='over';else serve();hud()}}
function rounded(x,y,w,h,r,color){c.fillStyle=color;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function draw(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#142744');g.addColorStop(1,'#070d1b');c.fillStyle=g;c.fillRect(0,0,W,H);c.strokeStyle='#ffffff0b';for(let x=0;x<W;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
for(const b of bricks)if(b.alive){c.shadowBlur=9;c.shadowColor=b.color;rounded(b.x,b.y,b.w,b.h,4,b.color)}c.shadowBlur=0;
const dropColors={wide:'#38bdf8',multi:'#a78bfa',laser:'#fb7185',slow:'#4ade80'},labels={wide:'W',multi:'M',laser:'L',slow:'S'};for(const d of drops){c.shadowBlur=12;c.shadowColor=dropColors[d.type];rounded(d.x-12,d.y-12,24,24,6,dropColors[d.type]);c.shadowBlur=0;c.fillStyle='#071324';c.textAlign='center';c.font='bold 15px Arial';c.fillText(labels[d.type],d.x,d.y+5)}
for(const p of particles){c.globalAlpha=Math.min(1,p.life/25);c.fillStyle=p.color;c.fillRect(p.x,p.y,4,4)}c.globalAlpha=1;
for(const s of shots){c.shadowBlur=12;c.shadowColor='#fb7185';rounded(s.x-2,s.y-14,4,15,2,'#fb7185')}c.shadowBlur=0;
c.shadowBlur=20;c.shadowColor=effects.laser>0?'#fb7185':'#22d3ee';rounded(paddle.x,paddle.y,paddle.w,paddle.h,7,effects.laser>0?'#fb7185':'#22d3ee');c.shadowBlur=14;c.shadowColor='#fff';for(const b of balls){c.beginPath();c.arc(b.x,b.y,b.r,0,Math.PI*2);c.fillStyle='#fff';c.fill()}c.shadowBlur=0;
if(mode!=='playing'){c.fillStyle='#020817bd';c.fillRect(0,0,W,H);c.textAlign='center';c.fillStyle='#fff';c.font='bold 34px Arial';c.fillText(({ready:'準備發球',paused:'遊戲暫停',won:'恭喜通關！',over:'遊戲結束'})[mode],W/2,H/2-15);c.fillStyle='#a9c5e6';c.font='19px Arial';c.fillText(mode==='over'||mode==='won'?'按 R 或開始按鈕重新挑戰':'按空白鍵或點擊畫面開始',W/2,H/2+28)}}
let prev=0,acc=0;function frame(t){if(!prev)prev=t;acc+=Math.min(t-prev,50);prev=t;while(acc>=1000/60){tick();acc-=1000/60}draw();requestAnimationFrame(frame)}restart();requestAnimationFrame(frame);
})();
</script></body></html>
